name: Reusable — Kani

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Crate or workspace root'
        type: string
        default: '.'
      args:
        description: 'Extra args for cargo kani'
        type: string
        default: ''
      runner:
        description: 'Override the runner label. Empty auto-selects by repo visibility, as the other reusables do.'
        type: string
        default: ''
      timeout-minutes:
        description: 'Job timeout'
        type: number
        default: 30

permissions:
  contents: read

env:
  KANI_VERSION: '0.68.0'

jobs:
  kani:
    name: Kani
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'ferrlabs-k8s-large' || 'ubuntu-latest') }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect harnesses
        id: detect
        run: |
          if grep -rqE --include='*.rs' --exclude-dir=target --exclude-dir=.git '#\[kani::proof' .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No #[kani::proof] harness found, nothing to verify"
          fi

      - if: steps.detect.outputs.found == 'true'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Kani cache
        if: steps.detect.outputs.found == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: kani-${{ runner.os }}-${{ runner.arch }}-${{ env.KANI_VERSION }}

      - name: Install Kani
        if: steps.detect.outputs.found == 'true'
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup

      - name: Run Kani
        if: steps.detect.outputs.found == 'true'
        env:
          KANI_ARGS: ${{ inputs.args }}
        run: cargo kani --workspace $KANI_ARGS
