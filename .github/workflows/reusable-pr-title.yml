name: Reusable — PR title (Conventional Commits)

# Callers declare the block below. `pull_request_target` is safe here
# because this workflow checks nothing out and reads only the title from
# the event payload, and the caller's `permissions` block is mandatory:
# a called workflow can only narrow what the caller grants it.
#
#   on:
#     pull_request_target: # zizmor: ignore[dangerous-triggers]
#       types: [opened, edited, reopened, synchronize]
#
#   permissions:
#     pull-requests: read
#
#   jobs:
#     title:
#       name: PR title
#       uses: FerrLabs/.github/.github/workflows/reusable-pr-title.yml@<sha>

on:
  workflow_call:
    inputs:
      runner:
        description: 'Override the runner label. Empty (default) auto-selects by repo visibility: private repos use ferrlabs-k8s-light, public repos use ubuntu-latest. The ferrlabs-k8s group sets allows_public_repositories=false, so a public repo pinned to it queues forever.'
        type: string
        required: false
        default: ''

concurrency:
  # `pull_request_target` runs in the base's context, so `github.ref` is
  # the base branch and every open PR would share one group. The PR number
  # keys it per pull request, with `github.ref` left as the fallback.
  group: reusable-pr-title-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Callers trigger on `pull_request_target`, so testing for
  # `pull_request` alone would never cancel anything.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request_target'
    || github.event_name == 'pull_request' }}

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional commits
    if: github.event.action != 'synchronize'
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'ferrlabs-k8s-light' || 'ubuntu-latest') }}
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            chore
            style
            test
            perf
            ci
            build
          requireScope: false
          subjectPattern: ^[A-Za-z].+$
          subjectPatternError: |
            Subject "{subject}" must start with an uppercase or lowercase letter and not be empty.
