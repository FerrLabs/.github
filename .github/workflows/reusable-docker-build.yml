name: Reusable — Docker build (lint, scan, sign, SBOM)

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Full image name (e.g. ghcr.io/ferrlabs/foo)'
        type: string
        required: true
      tag:
        description: 'Image tag (e.g. v1.2.3 or commit sha)'
        type: string
        required: true
      context:
        description: 'Docker build context'
        type: string
        required: false
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile relative to context'
        type: string
        required: false
        default: 'Dockerfile'
      platforms:
        description: 'Comma-separated build platforms. Multi-arch needs binfmt/qemu registered on the runner; the self-hosted ARC runners build linux/amd64 only.'
        type: string
        required: false
        default: 'linux/amd64'
      build-args:
        description: 'Newline-separated build args (KEY=VALUE)'
        type: string
        required: false
        default: ''
      extra-tags:
        description: 'Additional full image refs to tag, newline-separated (e.g. ghcr.io/ferrlabs/foo:sha-<gitsha> for traceability). Appended to <image-name>:<tag> and <image-name>:latest.'
        type: string
        required: false
        default: ''
      smoke-test-cmd:
        description: 'Shell command to functionally test the built image before it is pushed. When set, the image is built into the local buildah/containers store (single-platform only — set platforms accordingly), this command runs with $SMOKE_IMAGE pointing at that store ref, and the registry push happens only if it passes. Run it with `podman run "$SMOKE_IMAGE"` — NOT `docker run`: the image is not yet pushed and Docker does not share buildah''s store, so docker would try to pull the missing tag and fail with `manifest unknown`. Empty = skip.'
        type: string
        required: false
        default: ''
      trivy-severity:
        description: 'Trivy severities that fail the build'
        type: string
        required: false
        default: 'CRITICAL,HIGH'
      trivy-exit-code:
        description: "Exit code when trivy finds matching vulns ('1' = gate the build, '0' = report-only). Base-derived images with unpatchable upstream CVEs use '0'."
        type: string
        required: false
        default: '1'
      push:
        description: 'Push the image to the registry'
        type: boolean
        required: false
        default: true
      cache:
        description: 'Reuse a registry-side layer cache at `<image-name>-buildcache`. The ARC runners mount their container store on an emptyDir, so the local `--layers` cache dies with the pod and every build recompiles from scratch; keeping the cache in the registry is what makes it survive. A missing cache repo is a silent miss, so the first build just populates it, and a denied cache export degrades to an uncached build with a warning rather than failing the job. Set false for images whose layers are not worth caching.'
        type: boolean
        required: false
        default: true
      cache-ttl:
        description: 'Ignore cached layers older than this (buildah --cache-ttl, e.g. 24h). Bounds how long an image can keep shipping OS packages that upstream has already patched: a `RUN apk upgrade` layer is only rerun once its cache entry expires, so this is what decides how stale a security update can get. Raise it for an image whose layers are expensive and whose base carries no OS surface.'
        type: string
        required: false
        default: '24h'
      push-retries:
        description: 'How many times to retry each manifest push if the registry returns a transient error (5xx, network reset). Backoff is 10s, 30s, 90s, … capped at 5 min. Set to 1 to disable retries.'
        type: number
        required: false
        default: 3
      runner:
        description: 'GitHub Actions runner label for the build job (the heavy one). Private consumers pass `ferrlabs-k8s`; public consumers leave the default.'
        type: string
        required: false
        default: 'ubuntu-latest'
      helper-runner:
        description: >-
          Runner label for the four supporting jobs (hadolint, Trivy, cosign,
          SBOM). Leave empty to keep the historical behaviour: the self-hosted
          `ferrlabs-k8s` pool on a private repository, `ubuntu-latest` on a
          public one. That default reads a repository''s VISIBILITY as a proxy
          for WHICH ORGANISATION owns it, which holds only while every private
          consumer is a FerrLabs repository. A private repository in another
          organisation targets a runner label that does not exist there, and its
          jobs queue forever with no error. Such a consumer passes
          `ubuntu-latest` here.
        type: string
        required: false
        default: ''
      sccache-gha:
        description: >-
          Cache compiled artifacts in the GitHub Actions cache for the duration
          of the image build. For repositories that build on hosted runners,
          where the garage S3 cache the self-hosted pool uses is unreachable.
          The job exports the Actions cache credentials itself: they live in the
          runner environment and cannot be read from a workflow expression, so
          a caller cannot pass them in.
        type: boolean
        required: false
        default: false
      ref:
        description: >-
          Git ref to build. Empty (default) builds whatever the calling workflow
          runs on, which is right for a release-triggered build. Pass the tag
          when rebuilding an older version by hand: without it a manual re-run
          builds the current branch and labels it with the version you asked
          for, producing an image whose tag lies about its contents.
        type: string
        required: false
        default: ''
    outputs:
      digest:
        description: 'Image digest (sha256:...)'
        value: ${{ jobs.build.outputs.digest }}
    secrets:
      packages-read:
        description: 'GHCR token with read:packages, for installing private @ferrlabs/* npm or other authenticated fetches during the build. Exposed to BuildKit as a secret (id=packages-read) via --mount=type=secret, never as a build-arg, so it never lands in an image layer or the build log. In the Dockerfile: RUN --mount=type=secret,id=packages-read sh -c ''TOKEN="$(cat /run/secrets/packages-read)" ...'' (buildah does not support the env= key on secret mounts).'
        required: false
      cargo-registry-token:
        description: 'Token for the private cargo registry (Kellnr), for builds that fetch registry-based Kit crates in addition to git-based ones. Exposed to BuildKit as a secret (id=cargo-registry-token), same handling as packages-read. In the Dockerfile: RUN --mount=type=secret,id=cargo-registry-token sh -c ''CARGO_REGISTRIES_KELLNR_TOKEN="$(cat /run/secrets/cargo-registry-token)" cargo build ...''.'
        required: false
      sccache-s3-key:
        description: 'garage S3 access key (SCCACHE_S3_KEY) for a compiled-artifact cache INSIDE the image build. The registry layer cache only helps while the layer inputs are unchanged, and a release bumps the version line in Cargo.toml — which is an input of the layer that caches the dependency compile, so every release recompiles every dependency from scratch. sccache caches each crate individually and survives that. Exposed as a build secret (id=sccache-s3-key); the Dockerfile must degrade gracefully when it is absent.'
        required: false
      sccache-s3-secret:
        description: 'garage S3 secret key (SCCACHE_S3_SECRET). Pair of sccache-s3-key; both must be set for the cache to be wired in.'
        required: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  hadolint:
    name: hadolint
    # hadolint via its static binary (not the hadolint-action Docker container)
    # so it runs on the self-hosted pool for private repos — the ARC runners
    # have buildah but no Docker daemon. Public repos fall back to ubuntu-latest.
    runs-on: ${{ inputs.helper-runner != '' && inputs.helper-runner || (github.event.repository.private && 'ferrlabs-k8s-light' || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Lint Dockerfile (hadolint)
        run: |
          curl -fsSL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 \
            -o "${RUNNER_TEMP}/hadolint"
          chmod +x "${RUNNER_TEMP}/hadolint"
          # DL3008 (apt) / DL3018 (apk): pinning OS package versions is
          # impractical — Debian/Alpine point releases supersede them and exact
          # pins break the build. Every other warning still fails the gate.
          "${RUNNER_TEMP}/hadolint" --failure-threshold warning \
            --ignore DL3008 --ignore DL3018 \
            "${{ inputs.context }}/${{ inputs.dockerfile }}"

  build:
    name: Build & push
    needs: hadolint
    runs-on: ${{ inputs.runner }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      # The self-hosted ARC runners have buildah, not a Docker daemon — so we
      # build/push with buildah (not docker/buildx). The cosign / Trivy / SBOM
      # jobs below pull the pushed image from the registry, so they need no
      # daemon either. packages-read is exposed to the build as a BuildKit-style
      # `--mount=type=secret,id=packages-read`, never as a build-arg.
      - name: Login to GHCR
        if: startsWith(inputs.image-name, 'ghcr.io/')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: buildah login -u "${{ github.actor }}" --password-stdin ghcr.io <<< "$GHCR_TOKEN"
      # The Actions cache endpoint and token exist only inside a step's
      # environment. Exporting them here is what lets the build reach the cache;
      # they are handed to buildah as build secrets, never as build-args, so
      # they cannot land in an image layer.
      - name: Expose the Actions cache to the build
        if: inputs.sccache-gha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              core.exportVariable(name, process.env[name] ?? '')
            }

      - name: Build & push (buildah)
        id: push
        env:
          IMAGE: ${{ inputs.image-name }}
          TAG: ${{ inputs.tag }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          PLATFORMS: ${{ inputs.platforms }}
          BUILD_ARGS: ${{ inputs.build-args }}
          EXTRA_TAGS: ${{ inputs.extra-tags }}
          PUSH: ${{ inputs.push }}
          PUSH_RETRIES: ${{ inputs.push-retries }}
          SMOKE_CMD: ${{ inputs.smoke-test-cmd }}
          PACKAGES_READ: ${{ secrets.packages-read }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.cargo-registry-token }}
          SCCACHE_S3_KEY: ${{ secrets.sccache-s3-key }}
          SCCACHE_S3_SECRET: ${{ secrets.sccache-s3-secret }}
          SCCACHE_GHA: ${{ inputs.sccache-gha }}
          CACHE: ${{ inputs.cache }}
          CACHE_TTL: ${{ inputs.cache-ttl }}
        run: |
          set -euo pipefail

          secret_args=()
          if [ -n "${PACKAGES_READ:-}" ]; then
            printf '%s' "$PACKAGES_READ" > "$RUNNER_TEMP/packages-read"
            secret_args+=(--secret "id=packages-read,src=$RUNNER_TEMP/packages-read")
          fi
          if [ -n "${CARGO_REGISTRY_TOKEN:-}" ]; then
            printf '%s' "$CARGO_REGISTRY_TOKEN" > "$RUNNER_TEMP/cargo-registry-token"
            secret_args+=(--secret "id=cargo-registry-token,src=$RUNNER_TEMP/cargo-registry-token")
          fi
          # Compiled-artifact cache for Rust image builds. Both halves or
          # neither: a key without its secret would have the Dockerfile wire up
          # sccache against credentials that cannot authenticate, turning a
          # cache miss into a build failure.
          if [ "${SCCACHE_GHA:-false}" = "true" ] && [ -n "${ACTIONS_RUNTIME_TOKEN:-}" ] && [ -n "${ACTIONS_CACHE_URL:-${ACTIONS_RESULTS_URL:-}}" ]; then
            printf '%s' "${ACTIONS_CACHE_URL:-${ACTIONS_RESULTS_URL}}" >"$RUNNER_TEMP/gha-cache-url"
            printf '%s' "$ACTIONS_RUNTIME_TOKEN" >"$RUNNER_TEMP/gha-runtime-token"
            secret_args+=(--secret "id=gha-cache-url,src=$RUNNER_TEMP/gha-cache-url")
            secret_args+=(--secret "id=gha-runtime-token,src=$RUNNER_TEMP/gha-runtime-token")
            echo "Actions cache passed to the build"
          fi

          if [ -n "${SCCACHE_S3_KEY:-}" ] && [ -n "${SCCACHE_S3_SECRET:-}" ]; then
            printf '%s' "$SCCACHE_S3_KEY" > "$RUNNER_TEMP/sccache-s3-key"
            printf '%s' "$SCCACHE_S3_SECRET" > "$RUNNER_TEMP/sccache-s3-secret"
            secret_args+=(--secret "id=sccache-s3-key,src=$RUNNER_TEMP/sccache-s3-key")
            secret_args+=(--secret "id=sccache-s3-secret,src=$RUNNER_TEMP/sccache-s3-secret")
            echo "sccache credentials passed to the build"
          fi

          build_arg_args=()
          while IFS= read -r line; do
            [ -n "$line" ] && build_arg_args+=(--build-arg "$line")
          done <<< "${BUILD_ARGS:-}"

          # Registry-side layer cache. The runner's container store is an
          # emptyDir on an ephemeral ARC pod, so `--layers` alone caches
          # nothing across runs — a Rust image recompiles every dependency on
          # every build. Pushing the layers to `<image>-buildcache` is what
          # makes them outlive the pod.
          #
          # Only when the image lives on GHCR: that is the one registry the
          # step above authenticated against, and --cache-to needs push rights.
          # A missing cache repo is a silent miss (verified with buildah
          # 1.33.7), so the first build simply populates it.
          cache_args=()
          cache_to_args=()
          if [ "$CACHE" = "true" ] && [ "${IMAGE#ghcr.io/}" != "$IMAGE" ]; then
            CACHE_REPO="${IMAGE}-buildcache"
            cache_args+=(--cache-from "$CACHE_REPO" --cache-ttl "$CACHE_TTL")
            # Only publish the cache when we are publishing the image itself:
            # a build that is not pushed (smoke-test-only) must not overwrite
            # the cache other builds depend on.
            [ "$PUSH" = "true" ] && cache_to_args+=(--cache-to "$CACHE_REPO")
            echo "Layer cache: $CACHE_REPO (ttl $CACHE_TTL, publish=$PUSH)"
          fi

          run_build() {
            buildah build \
              --isolation=chroot --layers \
              --platform "$PLATFORMS" \
              "$@" \
              "${secret_args[@]}" "${build_arg_args[@]}" \
              --manifest "$IMAGE:$TAG" \
              -f "$CONTEXT/$DOCKERFILE" "$CONTEXT"
          }

          # A denied cache export must not fail a build whose image is fine.
          # The first build of a new image creates its `-buildcache` package,
          # and a package a workflow just created is not linked to the
          # repository, so GITHUB_TOKEN has no write access and the export
          # 403s once. Missing cache is already a silent miss; unwritable
          # cache is the same class of event and costs a slower build, not a
          # broken one. Every image added from now on hits this wall once.
          #
          # The retry reuses the layers the first attempt already committed to
          # the local store, so it is a cache-hit pass rather than a rebuild.
          build_log="$RUNNER_TEMP/buildah-build.log"
          if run_build "${cache_args[@]}" "${cache_to_args[@]}" 2>&1 | tee "$build_log"; then
            :
          elif [ ${#cache_to_args[@]} -gt 0 ] && grep -qi 'pushing cache' "$build_log"; then
            echo "::warning::layer cache export to ${CACHE_REPO} was denied; rebuilding without --cache-to. Link that GHCR package to this repository with write access to restore caching."
            run_build "${cache_args[@]}"
          else
            exit 1
          fi

          rm -f "$RUNNER_TEMP/packages-read" "$RUNNER_TEMP/cargo-registry-token" "$RUNNER_TEMP/gha-cache-url" "$RUNNER_TEMP/gha-runtime-token"

          if [ -n "${SMOKE_CMD:-}" ]; then
            echo "::group::smoke test"
            SMOKE_IMAGE="$IMAGE:$TAG" bash -euo pipefail -c "$SMOKE_CMD"
            echo "::endgroup::"
          fi

          if [ "$PUSH" != "true" ]; then
            echo "digest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GHCR push periodically returns 504 Gateway Timeout or resets the
          # connection mid-manifest. The build itself is fine; only the manifest
          # upload flaps. Retry each push N times with exponential backoff
          # (10s, 30s, 90s, capped at 300s) before failing the job.
          retries="${PUSH_RETRIES:-3}"
          retry_push() {
            local attempt=1
            local delay=10
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$retries" ]; then
                echo "::error::manifest push failed after $attempt attempt(s): $*"
                return 1
              fi
              echo "::warning::manifest push attempt $attempt failed, retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 3))
              [ "$delay" -gt 300 ] && delay=300
            done
          }

          retry_push buildah manifest push --all --digestfile "$RUNNER_TEMP/digest" \
            "$IMAGE:$TAG" "docker://$IMAGE:$TAG"
          retry_push buildah manifest push --all "$IMAGE:$TAG" "docker://$IMAGE:latest"
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            retry_push buildah manifest push --all "$IMAGE:$TAG" "docker://$ref"
          done <<< "${EXTRA_TAGS:-}"

          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"

  trivy:
    name: Trivy (CVE scan)
    needs: build
    if: inputs.push
    # medium, not inputs.runner (-large): Trivy just pulls the pushed image
    # from the registry and scans it — no buildah/compile, so it doesn't need
    # the scarce 2-slot large tier. Frees a large slot per docker-build run.
    runs-on: ${{ inputs.helper-runner != '' && inputs.helper-runner || (github.event.repository.private && 'ferrlabs-k8s' || 'ubuntu-latest') }}
    steps:
      # Trivy reads ~/.docker/config.json to pull the image; without this a
      # private GHCR image fails with a 401/manifest-unknown.
      - name: Login to GHCR
        if: startsWith(inputs.image-name, 'ghcr.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        # Authenticate the Trivy DB pull from ghcr.io/aquasecurity/trivy-db.
        # trivy-action already caches the DB (keyed by date), but on the first
        # scan of the day two images releasing in parallel (App + Render) both
        # cache-miss and pull the DB at once; anonymous concurrent GHCR pulls
        # get rate-limited, one scan exits 1 → the cosign job is skipped and the
        # image ships to GHCR unsigned. TRIVY_USERNAME/PASSWORD makes the DB
        # pull authenticated (per-account quota instead of per-IP anonymous),
        # which clears the contention. Note: GITHUB_TOKEN as an env var does NOT
        # help here — trivy only uses it for GitHub API calls (VEX repos), not
        # the OCI registry pull of the DB.
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ inputs.image-name }}:${{ inputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: true
          exit-code: ${{ inputs.trivy-exit-code }}
      - name: Upload SARIF
        # Best-effort: code scanning upload needs GitHub Advanced Security,
        # which isn't available on private repos without a GHAS licence. The
        # real gate is trivy's exit-code:1 above; don't fail the build just
        # because the Security-tab integration is unavailable.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  cosign:
    name: cosign (sign + attest)
    needs: [build, trivy]
    if: inputs.push
    # cosign from its static binary (not cosign-installer, which needs
    # envsubst/gettext absent from the minimal ARC image) so signing runs on the
    # self-hosted pool for private repos. Public repos fall back to ubuntu-latest.
    # Keyless signing uses the Actions OIDC token, which is available on
    # self-hosted runners too (needs id-token: write, already granted).
    runs-on: ${{ inputs.helper-runner != '' && inputs.helper-runner || (github.event.repository.private && 'ferrlabs-k8s-light' || 'ubuntu-latest') }}
    steps:
      - name: Install cosign
        run: |
          curl -fsSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 \
            -o "${RUNNER_TEMP}/cosign"
          chmod +x "${RUNNER_TEMP}/cosign"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Login to GHCR
        if: startsWith(inputs.image-name, 'ghcr.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes \
            "${{ inputs.image-name }}@${{ needs.build.outputs.digest }}"
      - name: Attest build provenance
        # Best-effort: GitHub artifact attestations are an org-plan feature
        # ("Feature not available for the … organization" otherwise). The
        # cosign keyless signature above is the real signing; don't fail the
        # build (and skip cosign) just because native provenance is off.
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

  sbom:
    name: SBOM (Syft → CycloneDX)
    needs: build
    if: inputs.push
    # medium, not inputs.runner (-large): Syft pulls the pushed image and
    # generates the SBOM — no buildah/compile, so no need for the large tier.
    runs-on: ${{ inputs.helper-runner != '' && inputs.helper-runner || (github.event.repository.private && 'ferrlabs-k8s' || 'ubuntu-latest') }}
    steps:
      # Syft pulls the image via the Docker keychain (~/.docker/config.json);
      # a private GHCR image needs this login or the scan fails to fetch it.
      - name: Login to GHCR
        if: startsWith(inputs.image-name, 'ghcr.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ inputs.image-name }}@${{ needs.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false
