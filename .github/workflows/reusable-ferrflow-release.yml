name: Reusable — FerrFlow Release

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Override the runner label. Empty (default) auto-selects by repo
          visibility: private repos use the self-hosted ferrlabs-k8s pool,
          public repos use ubuntu-latest. This is what lets a repo flip
          private <-> public without editing its release workflow.
        type: string
        required: false
        default: ''
      fetch-depth:
        description: 'Checkout fetch-depth. 0 (full history) is required for commit analysis and changelog generation.'
        type: number
        required: false
        default: 0
      dry-run:
        description: 'Run FerrFlow without creating releases or pushing changes.'
        type: boolean
        required: false
        default: false
      force-version:
        description: 'Force a specific version (VERSION, or NAME@VERSION for monorepos). Empty = analyse commits.'
        type: string
        required: false
        default: ''
      trigger-renovate:
        description: 'No effect: Renovate runs on a schedule in the cluster (FerrLabs/Infra, platform/renovate). Kept so existing callers stay valid.'
        type: boolean
        required: false
        default: false
      crates-io-trusted-publishing:
        description: >-
          Set this true in a repo that publishes crates to crates.io. The
          publish then authenticates with a short-lived token minted from this
          run's GitHub OIDC identity, and the org no longer holds a long-lived
          registry token.

          Every crate the repo publishes needs its own Trusted Publishing
          config in its crates.io settings, carrying this repository's owner and
          name, and the **caller** workflow's filename: crates.io reads the
          `workflow_ref` claim, which GitHub sets to the workflow that started
          the run, never the reusable one. One exchange covers every crate whose
          config matches, and a crate without a config is outside the token's
          scope, so its publish is refused.

          Leave it false in a repo that publishes no crate: the exchange would
          have no config to match and would fail the release.
        type: boolean
        required: false
        default: false
      deferred-publish:
        description: >-
          For repos with `deferPublish: true` in ferrflow.json. The release job
          then only bumps/tags/creates GitHub Releases (no inline publish);
          set this true to run a separate, independently re-runnable
          `ferrflow publish` job afterwards. This decouples publish from the
          tag: `ferrflow publish` is idempotent against the registry, so a
          flaky publish (e.g. Kellnr index lag on a just-published dependency)
          is fixed by re-running only the publish job — no "tag already exists,
          skip" trap. Leave false for repos that publish inline.
        type: boolean
        required: false
        default: false
    secrets:
      RENOVATE_TOKEN:
        required: false
      FERRLABS_DISPATCH_TOKEN:
        required: false
      TAG_SIGNING_KEY:
        required: false

concurrency:
  group: reusable-ferrflow-release-${{ github.workflow }}-${{ github.ref }}
  # Queue rather than cancel, as in reusable-release-rust. The release
  # commit is pushed without `[skip ci]`, so it starts another run of the
  # caller workflow; workflow-level concurrency is evaluated before the
  # job-level `chore(release):` guard, so that run would claim the group,
  # cancel the release still publishing, then skip all of its own jobs.
  # Collapsing a burst belongs in the caller's own group.
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release with FerrFlow
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'ferrlabs-k8s' || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false
      # Rust workspaces (the -Cloud api packages) carry a FerrFlow postBump
      # hook that runs `cargo update` to sync Cargo.lock after the version
      # bump. The release runner has no Rust by default, so install it when the
      # repo has a Cargo.toml.
      - if: ${{ hashFiles('**/Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Only when this job publishes. With `deferred-publish` the publish job
      # below does, and minting here would fail a release that publishes
      # nothing: the exchange is refused for a repo with no crate configured.
      - if: ${{ inputs.crates-io-trusted-publishing && !inputs.deferred-publish }}
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - uses: FerrLabs/FerrFlow@c2f21ae68fc16172d1bb123100d65dc041feb2a3 # v7.25.0
        env:
          # Lets cargo-based postBump hooks read the private Kellnr index.
          # Empty (and unused) for repos that don't consume Kellnr.
          CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.CARGO_REGISTRIES_KELLNR_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        with:
          dry_run: ${{ inputs.dry-run }}
          force_version: ${{ inputs.force-version }}
          bot: true
          # Signs the release tag. ferrflow[bot] cannot: an App holds no key,
          # and GitHub signs the commits it creates through its API but never
          # a tag object.
          #
          # The key is passed only when both variables are set, because the
          # action treats a key with no tagger identity as an error and fails
          # the release. Anything missing here means no signing rather than a
          # broken release: a repo the org secret does not reach, and a repo
          # where the variables do not resolve, both end up with an empty key.
          tag_signing_key: ${{ (vars.TAG_SIGNING_NAME != '' && vars.TAG_SIGNING_EMAIL != '') && secrets.TAG_SIGNING_KEY || '' }}
          tag_signing_name: ${{ vars.TAG_SIGNING_NAME }}
          tag_signing_email: ${{ vars.TAG_SIGNING_EMAIL }}

  publish:
    name: Publish with FerrFlow
    needs: release
    # Only for repos that defer publish (deferPublish in ferrflow.json). Separate
    # job so a flaky registry publish is re-runnable on its own — `ferrflow
    # publish` is idempotent against the registry, so re-running publishes only
    # what's tagged-but-missing (recovers the index-lag / partial-publish case).
    if: ${{ inputs.deferred-publish && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'ferrlabs-k8s' || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Latest main so the release job's version-bump commit + tags are
          # present — `ferrflow publish` publishes the currently-released
          # versions.
          ref: ${{ github.ref }}
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false
      # cargo publish needs the toolchain (it builds the .crate, and reads the
      # private Kellnr index for dependency metadata).
      - if: ${{ hashFiles('**/Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - if: ${{ inputs.crates-io-trusted-publishing }}
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - uses: FerrLabs/FerrFlow@c2f21ae68fc16172d1bb123100d65dc041feb2a3 # v7.25.0
        env:
          CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.CARGO_REGISTRIES_KELLNR_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        with:
          mode: publish
          dry_run: ${{ inputs.dry-run }}
          bot: true
